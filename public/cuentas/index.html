<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuentas Claras</title>
<meta name="description" content="Tus ingresos, gastos y ahorro mes a mes, con la previsión de lo que tendrás.">
<meta name="theme-color" content="#edf0f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e131a" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cuentas">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<style>
/* Layout: un libro de cuentas para el iPad. Cabecera fija con pestañas; una columna centrada (máx. 1120px)
   que se abre en rejilla de 12 en tableta; los importes van como en un extracto: mono, alineados a la derecha. */
:root {
  --bg: #edf0f4; --surface: #ffffff; --surface-2: #f5f7fa;
  --ink: #121926; --ink-2: #465165; --muted: #677285;
  --line: #dce2ea; --line-strong: #c3ccd8;
  --accent: #2346b0; --accent-ink: #ffffff; --accent-soft: #e7ecfa;
  --good: #0f7a52; --good-soft: #e3f4ec; --neg: #c42b2b; --neg-soft: #fcebea; --warn: #8f5500; --warn-soft: #fdf1dc;
  --c-inc: #1baf7a; --c-exp: #eb6834; --c-save: #2a78d6; --c-inv: #6250d6; --c-total: #121926;
  --scrim: rgba(18, 25, 38, .38); --shadow: 0 12px 32px rgba(18, 25, 38, .14);
  --f-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e131a; --surface: #161c25; --surface-2: #1c2330;
    --ink: #e8ecf2; --ink-2: #b6bfcc; --muted: #8b95a5;
    --line: #283140; --line-strong: #3a4556;
    --accent: #8aa4f6; --accent-ink: #0e131a; --accent-soft: #1e2a49;
    --good: #4cc99a; --good-soft: #15322a; --neg: #f07a7a; --neg-soft: #3a1f23; --warn: #e3a64a; --warn-soft: #3a2c15;
    --c-inc: #199e70; --c-exp: #d95926; --c-save: #3987e5; --c-inv: #9085e9; --c-total: #e8ecf2;
    --scrim: rgba(0, 0, 0, .58); --shadow: 0 12px 32px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e131a; --surface: #161c25; --surface-2: #1c2330;
  --ink: #e8ecf2; --ink-2: #b6bfcc; --muted: #8b95a5;
  --line: #283140; --line-strong: #3a4556;
  --accent: #8aa4f6; --accent-ink: #0e131a; --accent-soft: #1e2a49;
  --good: #4cc99a; --good-soft: #15322a; --neg: #f07a7a; --neg-soft: #3a1f23; --warn: #e3a64a; --warn-soft: #3a2c15;
  --c-inc: #199e70; --c-exp: #d95926; --c-save: #3987e5; --c-inv: #9085e9; --c-total: #e8ecf2;
  --scrim: rgba(0, 0, 0, .58); --shadow: 0 12px 32px rgba(0, 0, 0, .45);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
body.locked { overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
html { touch-action: manipulation; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }

/* Cabecera */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px 4px; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 21px; letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; min-width: 0; background: none; border: 0; padding: 0; color: inherit; cursor: pointer; text-align: left; }
#brand-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.brand-mark { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); display: grid; place-items: center; flex: none; }
.brand-mark svg { width: 16px; height: 16px; stroke: var(--accent-ink); }
.sync { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--good); display: inline-block; }
.sync.saving i { background: var(--warn); }
.sync.error i, .sync.local i { background: var(--neg); }
.sync.loading i { background: var(--line-strong); }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-block: 0; }
.tabs::-webkit-scrollbar { display: none; }
.tab { border: 0; background: none; padding: 10px 12px 11px; font-weight: 500; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; font-size: 15px; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

main { padding-block: 20px 120px; display: flex; flex-direction: column; gap: 18px; }

/* Piezas comunes */
.eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.card-h h2 { font-family: var(--f-display); font-weight: 600; font-size: 18px; letter-spacing: -.005em; }
.card-h .sub { color: var(--muted); font-size: 13px; }
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; }
.s-12 { grid-column: span 12; } .s-7 { grid-column: span 7; } .s-6 { grid-column: span 6; } .s-5 { grid-column: span 5; } .s-4 { grid-column: span 4; }
@media (max-width: 920px) { .s-4 { grid-column: span 6; } .s-4.wide { grid-column: span 12; } }
@media (max-width: 720px) { .grid > * { grid-column: span 12 !important; } }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.link { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 500; text-align: left; }
.btn { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 10px; padding: 9px 14px; font-weight: 500; min-height: 40px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--neg); border-color: var(--neg); background: var(--surface); }
.btn.danger.solid { background: var(--neg); color: var(--surface); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent); }
.btn:disabled { opacity: .5; cursor: default; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.pos { color: var(--good); } .negt { color: var(--neg); }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.pill.now { background: var(--accent-soft); color: var(--accent); }
.pill.neg { background: var(--neg-soft); color: var(--neg); }

/* Avisos */
.notice { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
.notice svg { flex: none; width: 20px; height: 20px; margin-top: 1px; }
.notice.neg { background: var(--neg-soft); border-color: transparent; } .notice.neg svg { stroke: var(--neg); }
.notice.warn { background: var(--warn-soft); border-color: transparent; } .notice.warn svg { stroke: var(--warn); }
.notice.info { background: var(--accent-soft); border-color: transparent; } .notice.info svg { stroke: var(--accent); }
.notice .n-body { display: flex; flex-direction: column; gap: 8px; min-width: 0; flex: 1; }
.notice b { font-weight: 600; }

/* Resumen: cabecera de cifras */
.hero { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 18px 32px; padding-block: 4px 6px; }
.hero-num { font-size: clamp(40px, 7vw, 60px); font-weight: 600; letter-spacing: -.025em; line-height: 1.05; margin-top: 4px; }
.hero-accs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.acc-chip { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 12px; font-size: 14px; color: var(--ink-2); }
.acc-chip b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.kdot { width: 8px; height: 8px; border-radius: 50%; background: var(--line-strong); flex: none; }
.k-ahorro { background: var(--c-save); }
.k-inversion { background: var(--c-inv); }
.k-corriente { background: var(--ink-2); }
.hero-side { text-align: right; }
.side-num { font-size: 28px; font-weight: 600; letter-spacing: -.015em; margin-top: 4px; }
.delta { font-size: 13px; color: var(--muted); }
@media (max-width: 560px) { .hero-side { text-align: left; } }

/* Cifras del mes */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
.stat { padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat + .stat { border-left: 1px solid var(--line); }
.stat .lbl { font-size: 13px; color: var(--muted); }
.stat .val { font-size: 21px; font-weight: 600; letter-spacing: -.01em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat .sub { font-size: 12px; color: var(--muted); }
.card .stats { border-radius: 10px; }
@media (max-width: 640px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } .stat:nth-child(3) { border-left: 0; } .stat:nth-child(n+3) { border-top: 1px solid var(--line); } }
.meter { display: flex; flex-direction: column; gap: 6px; }
.meter-track { height: 8px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.meter-fill { height: 100%; border-radius: 99px; background: var(--accent); }
.meter-fill.warn { background: var(--warn); } .meter-fill.neg { background: var(--neg); }
.meter-txt { font-size: 13px; color: var(--ink-2); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }

/* Gráficos */
.chart { position: relative; width: 100%; min-height: 200px; touch-action: pan-y; }
.chart svg { display: block; overflow: visible; }
.chart .gl { stroke: var(--line); stroke-width: 1; }
.chart .gl.zero { stroke: var(--line-strong); }
.chart .ax { fill: var(--muted); font-size: 11px; font-family: var(--f-body); font-variant-numeric: tabular-nums; }
.chart .xh { stroke: var(--line-strong); stroke-width: 1; }
.chart .band { fill: var(--surface-2); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
.legend i.sq { width: 10px; height: 10px; border-radius: 3px; }
.legend b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.tip { position: absolute; top: 6px; z-index: 5; pointer-events: none; background: var(--surface); border: 1px solid var(--line-strong); box-shadow: var(--shadow); border-radius: 10px; padding: 8px 10px; font-size: 13px; min-width: 150px; }
.tip .t-h { font-weight: 600; margin-bottom: 4px; }
.tip .t-r { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.tip .t-r span { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); }
.tip .t-r b { font-variant-numeric: tabular-nums; font-weight: 600; }
.tip i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }

/* Barras de categorías */
.catbars { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.catbars li { display: grid; grid-template-columns: minmax(0, 7.5em) minmax(0, 1fr) auto; align-items: center; gap: 10px; font-size: 14px; }
.cb-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
.cb-track { height: 12px; }
.cb-fill { display: block; height: 100%; background: var(--c-exp); border-radius: 0 4px 4px 0; min-width: 2px; }
.cb-val { font-variant-numeric: tabular-nums; font-weight: 500; text-align: right; }

/* Listas de movimientos */
.month-nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.month-nav .mn { display: flex; align-items: center; gap: 6px; }
.month-nav h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(24px, 4vw, 32px); letter-spacing: -.015em; min-width: 7.5em; text-align: center; }
.icon-btn { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); display: grid; place-items: center; flex: none; }
.icon-btn svg { width: 18px; height: 18px; stroke: var(--ink); }
.section-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.section-h h2 { font-family: var(--f-display); font-weight: 600; font-size: 18px; }
.section-h .sub { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.rows { list-style: none; margin: 0; padding: 0; }
.row { display: grid; grid-template-columns: 44px minmax(0, 1fr); align-items: center; gap: 6px; border-top: 1px solid var(--line); }
.rows.nochk .row { grid-template-columns: minmax(0, 1fr); }
.rows .row:first-child { border-top: 0; }
.chk { width: 44px; height: 48px; border: 0; background: none; display: grid; place-items: center; padding: 0; }
.chk::before { content: ""; grid-area: 1 / 1; width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line-strong); background: var(--surface); }
.chk svg { grid-area: 1 / 1; width: 14px; height: 14px; stroke: var(--accent-ink); position: relative; }
.row.done .chk::before { background: var(--accent); border-color: var(--accent); }
.row-main { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px; border: 0; background: none; text-align: left; padding: 10px 2px; min-height: 52px; width: 100%; }
.r-txt { display: flex; flex-direction: column; min-width: 0; }
.r-name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.r-meta { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.r-meta .tag { color: var(--accent); font-weight: 600; }
.r-meta .pend { color: var(--warn); font-weight: 500; }
.r-amt { font-family: var(--f-num); font-variant-numeric: tabular-nums; font-size: 15px; white-space: nowrap; text-align: right; }
.r-amt.t-ingreso { color: var(--good); }
.r-amt .r-of { display: block; font-family: var(--f-body); font-size: 12px; color: var(--muted); }
.row.pend .r-amt { color: var(--muted); }
.row.pend .r-name { color: var(--ink-2); }
/* Reparto de lo que sobra entre la cuenta de ahorro y la de inversión */
.split { display: flex; flex-direction: column; gap: 10px; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); margin-top: 8px; }
.split-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.split-h .lbl { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.split-h .sub { font-size: 12px; color: var(--muted); }
.split-lab { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.split-lab > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.split-lab .r { align-items: flex-end; text-align: right; }
.split-lab b { font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.split-v { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.sdot { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.sdot.s1 { background: var(--c-save); } .sdot.s2 { background: var(--c-inv); }
.split-range { -webkit-appearance: none; appearance: none; width: 100%; height: 34px; margin: 0; background: transparent; cursor: pointer; }
.split-range::-webkit-slider-runnable-track { height: 12px; border-radius: 99px; background: linear-gradient(to right, var(--c-save) var(--p, 100%), var(--c-inv) var(--p, 100%)); }
.split-range::-moz-range-track { height: 12px; border-radius: 99px; background: linear-gradient(to right, var(--c-save) var(--p, 100%), var(--c-inv) var(--p, 100%)); }
.split-range::-webkit-slider-thumb { -webkit-appearance: none; width: 30px; height: 30px; margin-top: -9px; border-radius: 50%; background: var(--surface); border: 2px solid var(--ink-2); box-shadow: 0 1px 4px rgba(0, 0, 0, .25); }
.split-range::-moz-range-thumb { width: 26px; height: 26px; border-radius: 50%; background: var(--surface); border: 2px solid var(--ink-2); }
.split-range:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
.split-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; font-size: 13px; color: var(--muted); }
.split.done { background: var(--accent-soft); border-color: transparent; }
.split.done .lbl { color: var(--accent); }
/* Presupuestos: gastos que se van haciendo poco a poco */
.ring { width: 44px; height: 48px; display: grid; place-items: center; }
.ring svg { width: 28px; height: 28px; transform: rotate(-90deg); }
.ring .tr { fill: none; stroke: var(--line-strong); stroke-width: 4; }
.ring .ar { fill: none; stroke: var(--accent); stroke-width: 4; stroke-linecap: round; }
.ring.warn .ar, .bud-bar.warn span, .bud-big.warn .bud-bar span { stroke: var(--warn); background: var(--warn); }
.ring.neg .ar, .bud-bar.neg span { stroke: var(--neg); background: var(--neg); }
.bud-bar { display: block; position: relative; height: 6px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); margin-top: 6px; overflow: visible; }
.bud-bar span { display: block; height: 100%; max-width: 100%; border-radius: 99px; background: var(--accent); }
.bud-bar em { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink-2); border-radius: 1px; }
.bud-bar.big { height: 12px; }
.bud-head { display: flex; flex-direction: column; gap: 2px; }
.bud-head .v { font-size: 28px; font-weight: 600; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.bud-add { display: grid; grid-template-columns: minmax(0, 8em) minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.bud-add .inp { min-width: 0; }
.spends { list-style: none; margin: 0; padding: 0; }
.spends li { display: grid; grid-template-columns: minmax(0, 1fr) auto 40px; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); }
.spends li:first-child { border-top: 0; }
.spends .n { display: flex; flex-direction: column; min-width: 0; }
.spends .n small { color: var(--muted); font-size: 12px; }
.spends .a { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.spends .x { width: 40px; height: 40px; border: 0; background: none; color: var(--muted); font-size: 20px; border-radius: 10px; }
.bud-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px 24px; }
.bud-list button { text-align: left; border: 0; background: none; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.bud-list .t { display: flex; justify-content: space-between; gap: 8px; font-weight: 500; }
.bud-list .t span:last-child { font-variant-numeric: tabular-nums; color: var(--ink-2); font-weight: 400; }
.acc-in { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 9.5em); align-items: center; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); }
.acc-in:first-of-type { border-top: 0; }

    const t0 = totals(list), auto = Math.round((t0.sobra - t0.ahorro) * 100) / 100;
    const amount = o.amount != null ? o.amount : auto;
    if (Math.abs(amount) > 0.005 || o.status === 'hecho')
      list.push({ id: 'sweep', sweep: true, fixed: false, auto, type: 'ahorro', name: amount < 0 ? 'Lo que falta' : 'Lo que sobra', cat: '', acc: sweepCfg().acc || null, amount, day: daysIn(k), status: o.status || 'pendiente' });

}
/* Las dos cuentas entre las que se reparte lo que sobra: la de ahorro (primero) y la otra, normalmente la de inversión */
function sweepPair() {
  if (!sweepOn()) return null;
  const d = sweepDest(); if (!d) return null;
  const sw = sweepCfg(), over = accById(sw.over);
  const o = isSaving(over) && over.id !== d.id ? over : C().accounts.find(a => isSaving(a) && a.id !== d.id);

}
/* % de lo que sobra que va a la primera cuenta: el general o el de ese mes */
const splitDefault = () => { const v = Number(sweepCfg().split); return sweepCfg().split != null && v >= 0 && v <= 100 ? v : 100; };
/* Reparte una cantidad que sobra en un mes: a la cuenta de ahorro el % de la barrita (hasta el tope), el resto a la otra */
function distribute(k, A, balOf) {

  if (cap > 0 && a > cap - balOf(id0)) { a = Math.max(0, cap - balOf(id0)); capHit = true; }
  if (Math.abs(a) > 0.005) to[id0] = a;

}
const r2 = x => Math.round(x * 100) / 100;
const splitFor = k => { const v = (monthDoc(k).sweep || {}).split; return v != null ? Number(v) : splitDefault(); };
const sweepCfg = () => C().sweep || { on: true, acc: null };
const sweepOn = () => sweepCfg().on !== false;
function sweepDest() { const a = accById(sweepCfg().acc); return isSaving(a) ? a : firstSaving(); }
function totals(list) {
  const t = { ingreso: 0, gasto: 0, ahorro: 0, ingresoDone: 0, gastoDone: 0, ahorroDone: 0, pending: 0 };
  for (const it of list) { t[it.type] += it.amount; if (it.status === 'hecho') t[it.type + 'Done'] += it.amount; else if (!it.sweep) t.pending++; if (it.sweep) t.sweep = it.amount || 0.001; }

}
const sortItems = l => l.slice().sort((a, b) => (a.day ?? 99) - (b.day ?? 99) || a.name.localeCompare(b.name, 'es'));

/* Previsión. Da igual de qué cuenta entra o sale cada cosa: las cuentas corrientes van juntas (cc) y las de ahorro e inversión también (save).
   Lo marcado como hecho ya está en los saldos; lo pendiente (de este mes en adelante) se suma o se resta. */
function project(n) {
  const c = C(), sw = sweepCfg();
  let cc = sum(c.accounts.filter(a => !isSaving(a)), a => a.balance || 0);
  const sv = {};
  for (const a of c.accounts.filter(isSaving)) sv[a.id] = a.balance || 0;
  const base = (firstSaving() || {}).id || '_save';
  if (!(base in sv)) sv[base] = 0;
  const destOf = it => { const a = accById(it.acc); return isSaving(a) ? a.id : base; };
  const pots = () => { let aho = 0, inv = 0; for (const [id, v] of Object.entries(sv)) { if ((accById(id) || {}).kind === 'inversion') inv += v; else aho += v; } return { aho, inv, save: aho + inv }; };
  const start = { cc, ...pots() }; start.total = cc + start.save;
  const rows = [];
  for (let i = 0; i < n; i++) {
    const k = addM(CUR, i), { list } = itemsFor(k), t = totals(list), split = {};

    for (const it of list) {
      if (it.status === 'hecho') continue;
      if (it.type === 'ingreso') cc += it.amount;
      else if (it.type === 'gasto') cc -= it.amount;
      else { // al ahorro, también lo que sobra (o lo que falta, en negativo)
        cc -= it.amount;
        if (it.sweep) {
          const r = distribute(k, it.amount, id => sv[id] || 0);
          for (const [id, v] of Object.entries(r.to)) { if (!(id in sv)) sv[id] = 0; sv[id] += v; split[id] = v; }
          if (r.capHit) capHit = true;
        } else sv[destOf(it)] += it.amount;

    }

    rows.push({ k, t, cc, ...p, total: cc + p.save, split, capHit });

}
const hasInvest = () => C().accounts.some(a => a.kind === 'inversion');
function deleteRec(id) {
  const c = C();
  c.recurring = c.recurring.filter(x => x.id !== id); saveConfig();
  for (const k of Object.keys(S.months)) { const d = S.months[k]; if (d.rec && d.rec[id]) { delete d.rec[id]; saveMonth(k); } }
}
function goalInfo() {
  const g = C().goal;
  if (!g || !(g.target > 0)) return null;
  const months = Math.max(1, diffM(CUR, g.month) + 1);
  const P = project(Math.max(months, 60));
  const current = P.start.aho;
  const at = g.month >= CUR ? P.rows[Math.min(months, P.rows.length) - 1].aho : current;
  const reachRow = current >= g.target ? null : P.rows.find(r => r.aho >= g.target - 0.005);
  return { g, months, current, at, ok: at >= g.target, reached: current >= g.target, reach: reachRow ? reachRow.k : null,
    need: Math.max(0, (g.target - current) / months), pace: (at - current) / months, pct: Math.min(1, current / g.target), atPct: Math.min(1, at / g.target) };
}

/* ---------- Guardado ---------- */
const dirty = new Set(), pending = {}, inflight = {};
function setSync(s) {
  S.sync = s;
  const el = $('#sync'); if (!el) return;
  const txt = { loading: 'Abriendo…', saved: 'Guardado', saving: 'Guardando…', error: 'No se ha podido guardar', local: IS_APP ? 'Guardado en el móvil' : 'Solo en este navegador' }[s];
  el.className = 'sync ' + (s === 'local' && IS_APP ? 'saved' : s); el.querySelector('span').textContent = txt;
}
function persist(path, data) {
  if (S.mode === 'local') { saveLocal(); return; }
  if (S.mode !== 'db') return;
  dirty.add(path);
  pending[path] = { data: data ? clone(data) : null };
  setSync('saving');
  if (!inflight[path]) flush(path);
}
async function flush(path) {
  inflight[path] = true;
  while (pending[path]) {
    const { data } = pending[path]; delete pending[path];
    for (let attempt = 0; attempt < 2; attempt++) {
      try { const ref = DB.doc(path); if (data) await ref.set(data); else await ref.delete(); break; }
      catch (e) {
        const code = e && e.code;
        if (code === 'unavailable' && attempt === 0) { await new Promise(r => setTimeout(r, 600 + Math.random() * 900)); continue; }
        setSync('error');
        toast(code === 'quota_exceeded' ? 'Se ha llenado el espacio de guardado. Borra meses antiguos o exporta una copia.'
          : code === 'invalid_argument' ? 'No tienes permiso para guardar cambios en esta página.'
          : 'No se ha podido guardar el último cambio. Revisa la conexión y vuelve a intentarlo.');
        break;
      }
    }
  }
  inflight[path] = false;
  dirty.delete(path);
  if (!Object.values(inflight).some(Boolean) && S.sync !== 'error') setSync('saved');
}
function saveConfig() { persist('app/config', S.config); }
function saveMonth(k) {
  const d = S.months[k];
  if (d && !(d.items || []).length && !Object.keys(d.rec || {}).length && !d.sweep && !d.closed && !Object.keys(d.spends || {}).length) delete S.months[k];
  persist('months/' + k, S.months[k] || null);
}
const LS_KEY = 'cuentas-claras-v1';
function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify({ config: S.config, months: S.months })); setSync('local'); askPersist(); } catch (e) { setSync('error'); toast('No se ha podido guardar en el móvil. Haz una copia de seguridad cuanto antes.'); } }
function loadLocal() { try { const d = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); if (d) { S.config = d.config || null; S.months = d.months || {}; } } catch (e) { /* sin datos */ } }

/* ---------- Lo fijo abajo, pegado a lo que se ve ----------
   En el iPhone el teclado y las barras cambian la parte visible sin mover lo fijo:
   el botón Añadir, los avisos y las hojas se colocan con estas medidas. */
(function () {
  const vv = window.visualViewport;
  if (!vv) return;
  const root = document.documentElement;
  let raf = 0;
  const sync = () => {
    raf = 0;
    const kb = Math.max(0, window.innerHeight - (vv.offsetTop + vv.height));
    root.style.setProperty('--kb', Math.round(kb) + 'px');
    root.style.setProperty('--vvh', Math.round(vv.height) + 'px');
    root.style.setProperty('--vvt', Math.round(vv.offsetTop) + 'px');
  };
  const queue = () => { if (!raf) raf = requestAnimationFrame(sync); };
  vv.addEventListener('resize', queue);
  vv.addEventListener('scroll', queue);
  window.addEventListener('scroll', queue, { passive: true });
  sync();
})();

/* ---------- Arranque ---------- */
async function boot() {
  route();
  render();
  let db = null;
  try { db = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch (e) { db = null; }
  if (!db) { S.mode = 'local'; loadLocal(); S.loaded = { config: true, months: true }; setSync('local'); render(); return; }
  DB = db; S.mode = 'db';
  const fail = e => {
    setSync('error');
    if (!(S.loaded.config && S.loaded.months)) { S.loadError = true; S.loaded = { config: true, months: true }; render(); }
    else if (e && e.code === 'revoked') toast('Ya no tienes acceso a estos datos.');
  };
  DB.doc('app/config').onSnapshot(snap => {
    if (!dirty.has('app/config')) S.config = snap.exists ? clone(snap.data()) : null;
    S.loaded.config = true; if (S.sync === 'loading') setSync('saved');
    render();
  }, fail);
  DB.collection('months').onSnapshot(snap => {
    const seen = new Set();
    for (const d of snap.docs) { seen.add(d.id); if (!dirty.has('months/' + d.id)) S.months[d.id] = clone(d.data()); }
    for (const k of Object.keys(S.months)) if (!seen.has(k) && !dirty.has('months/' + k)) delete S.months[k];
    S.loaded.months = true;
    render();
  }, fail);
}

/* Saldos que la app espera al acabar un mes: lo de hoy más lo pendiente de ese mes, con lo que sobra ya repartido */
function expectedBalances(k) {
  const c = C(), bal = {}; for (const a of c.accounts) bal[a.id] = a.balance || 0;
  const main = c.accounts.find(a => !isSaving(a));
  const act = it => it.budget && it.logged && it.status !== 'hecho' ? it.spent : it.amount; // de un presupuesto, lo gastado
  const list = itemsFor(k).list;
  for (const it of list) {

    else if (it.type === 'gasto') bal[main.id] -= act(it);
    else { bal[main.id] -= it.amount; const dd = isSaving(accById(it.acc)) ? it.acc : (firstSaving() || {}).id; if (dd) bal[dd] += it.amount; }

/* Mes */
function budState(it, k) {
  const pct = it.limit > 0 ? it.spent / it.limit : (it.spent > 0 ? 2 : 0);
  const time = k === REAL_CUR ? TODAY / daysIn(k) : k < REAL_CUR ? 1 : 0;
  const cls = pct > 1 ? 'neg' : (pct > 0.85 || (time && pct > time + 0.15)) ? 'warn' : '';
  return { pct, time, cls, left: r2(it.limit - it.spent) };
}
function budgetRow(k, it) {
  const st = budState(it, k), C2 = 2 * Math.PI * 11, done = it.status === 'hecho';
  const meta = ['<span class="tag">Presupuesto</span>', st.left < 0 ? `<span class="negt">te has pasado ${eur(-st.left)}</span>` : `quedan ${eur(st.left)}`,
    it.logged ? (it.logged === 1 ? '1 gasto' : it.logged + ' gastos') : 'sin gastos apuntados', !done && st.cls === 'warn' && st.time && st.pct > st.time + 0.15 ? 'por encima del ritmo' : ''].filter(Boolean).join(' · ');
  return `<li class="row ${done ? 'done' : ''}">
    <span class="ring ${st.cls}" aria-hidden="true"><svg viewBox="0 0 28 28"><circle class="tr" cx="14" cy="14" r="11"/><circle class="ar" cx="14" cy="14" r="11" stroke-dasharray="${(Math.min(1, st.pct) * C2).toFixed(1)} ${C2.toFixed(1)}"/></svg></span>
    <button class="row-main" data-act="budget-open" data-k="${k}" data-key="${it.id}"><span class="r-txt"><span class="r-name">${esc(it.name)}</span><span class="r-meta">${meta}</span>
      <span class="bud-bar ${st.cls}"><span style="width:${Math.min(100, st.pct * 100).toFixed(1)}%"></span>${st.time > 0 && st.time < 1 ? `<em style="left:${(st.time * 100).toFixed(1)}%" title="Hoy"></em>` : ''}</span></span>
      <span class="r-amt">${eur(it.spent)}<span class="r-of">de ${eur(it.limit)}</span></span></button>
  </li>`;
}
function rowHtml(k, it, split) {

const dotFor = id => (accById(id) || {}).kind === 'inversion' ? 's2' : 's1';

      <td>${eur(r.t.ingreso, { dec: 0 })}</td><td>${eur(r.t.gasto, { dec: 0 })}</td><td class="${r.t.sobra < 0 ? 'negt' : ''}">${eur(r.t.sobra, { dec: 0 })}</td><td>${eur(r.t.ahorro - r.t.ahorroDone, { dec: 0 })}${Math.abs(r.t.ahorroDone) > 0.5 ? `<span class="small muted"> +${eur(r.t.ahorroDone, { dec: 0 })} ya hecho</span>` : ''}</td>

/* Fijos */
function freqText(r) {
  if (r.amounts) return 'Importe distinto cada mes (media de los próximos 12)';
  if (r.months && r.months.length) {
    const ms = r.months.slice().sort((a, b) => a - b);
    return ms.length === 12 ? 'Cada mes' : 'En ' + ms.map(m => MES3[m - 1]).join(', ') + ' · ' + ms.length + (ms.length === 1 ? ' mes' : ' meses') + ' al año';
  }
  const f = Number(r.freq) || 1, m0 = pk(r.from).m;
  if (f === 1) return 'Cada mes';
  const ms = []; for (let i = 0; i < 12; i += f) ms.push(MES3[(m0 - 1 + i) % 12]);
  if (f === 12) return 'Cada año en ' + MESES[m0 - 1];
  return 'Cada ' + f + ' meses (' + ms.join(', ') + ')';
}

  return h;

/* ---------- Gráficos ---------- */
function niceTicks(min, max, count) {
  if (max - min < 1e-9) max = min + 100;
  const raw = (max - min) / count, mag = Math.pow(10, Math.floor(Math.log10(raw))), nrm = raw / mag;
  const step = (nrm <= 1 ? 1 : nrm <= 2 ? 2 : nrm <= 2.5 ? 2.5 : nrm <= 5 ? 5 : 10) * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, ticks = [];
  for (let v = lo; v <= hi + step / 2; v += step) ticks.push(Math.round(v * 100) / 100);
  return { lo, hi, ticks };
}
function drawCharts() { hiders = []; document.querySelectorAll('[data-chart]').forEach(h => { const f = charts[h.dataset.chart]; if (f) f(h); }); }
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(drawCharts, 150); });

let hiders = [];
document.addEventListener('pointerdown', e => { if (!e.target.closest('.chart')) hiders.forEach(f => f()); });
/* Ratón: pasar por encima enseña el dato y un clic abre. Dedo: un toque enseña el dato, otro toque en el mismo sitio abre. */
function attachHover(host, W, idxAt, show, hide, onPick) {
  const svg = host.querySelector('svg');
  let last = -1, armed = -1;
  const at = e => { const r = svg.getBoundingClientRect(); return idxAt((e.clientX - r.left) * (W / r.width)); };
  const off = () => { last = -1; armed = -1; hide(); };
  svg.addEventListener('pointermove', e => { const i = at(e); if (i !== last) { last = i; if (e.pointerType !== 'mouse') armed = i; show(i); } });
  svg.addEventListener('pointerdown', e => {
    const i = at(e);
    if (onPick && (e.pointerType === 'mouse' || armed === i)) { onPick(i); return; }
    armed = i; last = i; show(i);
  });
  svg.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') off(); });
  hiders.push(off);
  svg.style.cursor = onPick ? 'pointer' : 'crosshair';
}
function placeTip(host, tip, x, W, html) {
  tip.innerHTML = html; tip.hidden = false;
  const tw = tip.offsetWidth;
  let left = x + 14; if (left + tw > W) left = x - tw - 14; if (left < 0) left = 0;
  tip.style.left = left + 'px';
}
function lineChart(host, o) {
  const W = Math.max(260, host.clientWidth), H = W < 560 ? 210 : 250, L = 46, R = 22, T = 12, B = 28, n = o.labels.length;
  const vals = o.series.flatMap(s => s.values);
  const nt = niceTicks(Math.min(0, ...vals), Math.max(0, ...vals), H < 230 ? 3 : 4);
  const x = i => L + (n <= 1 ? (W - L - R) / 2 : i * (W - L - R) / (n - 1));
  const y = v => T + (nt.hi - v) / ((nt.hi - nt.lo) || 1) * (H - T - B);
  const base = y(Math.min(Math.max(0, nt.lo), nt.hi));
  let g = '';
  for (const t of nt.ticks) g += `<line class="gl${t === 0 ? ' zero' : ''}" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text class="ax" x="${L - 8}" y="${y(t) + 4}" text-anchor="end">${compact(t)}</text>`;
  const every = Math.max(1, Math.ceil(n / Math.max(2, Math.floor((W - L - R) / 52))));
  for (let i = 0; i < n; i += every) g += `<text class="ax" x="${x(i)}" y="${H - 8}" text-anchor="middle">${esc(o.labels[i])}</text>`;
  let p = '';
  o.series.forEach(s => {
    const pts = s.values.map((v, i) => x(i).toFixed(1) + ',' + y(v).toFixed(1));
    if (s.area) p += `<path d="M${pts.join(' L')} L${x(n - 1)},${base} L${x(0)},${base} Z" style="fill:${s.color};fill-opacity:.1;stroke:none"/>`;
    p += `<path d="M${pts.join(' L')}" style="fill:none;stroke:${s.color};stroke-width:2;stroke-linejoin:round;stroke-linecap:round"/>`;
    p += `<circle cx="${x(n - 1)}" cy="${y(s.values[n - 1])}" r="4" style="fill:${s.color};stroke:var(--surface);stroke-width:2"/>`;
  });
  const hov = `<g class="hov" visibility="hidden"><line class="xh" y1="${T}" y2="${H - B}"/>${o.series.map(s => `<circle r="5" style="fill:${s.color};stroke:var(--surface);stroke-width:2"/>`).join('')}</g>`;
  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(o.aria)}">${g}${p}${hov}<rect x="${L - 6}" y="0" width="${W - L - R + 12}" height="${H}" style="fill:transparent"/></svg><div class="tip" hidden></div>`;
  const svg = host.querySelector('svg'), hg = svg.querySelector('.hov'), tip = host.querySelector('.tip'), line = hg.querySelector('line'), dots = hg.querySelectorAll('circle');
  attachHover(host, W, px => Math.max(0, Math.min(n - 1, Math.round((px - L) / ((W - L - R) / Math.max(1, n - 1))))), i => {
    hg.setAttribute('visibility', 'visible'); line.setAttribute('x1', x(i)); line.setAttribute('x2', x(i));
    o.series.forEach((s, j) => { dots[j].setAttribute('cx', x(i)); dots[j].setAttribute('cy', y(s.values[i])); });
    placeTip(host, tip, x(i), W, `<div class="t-h">${esc(o.titles[i])}</div>${o.series.map(s => `<div class="t-r"><span><i style="background:${s.color}"></i>${s.name}</span><b>${eur(s.values[i], { dec: 0 })}</b></div>`).join('')}${o.tipExtra ? o.tipExtra(i).map(([l, v]) => `<div class="t-r"><span>${l}</span><b>${eur(v, { dec: 0 })}</b></div>`).join('') : ''}`);
  }, () => { hg.setAttribute('visibility', 'hidden'); tip.hidden = true; });
}

function barChart(host, o) {

  }

  toggle: el => toggleItem(el.dataset.k, el.dataset.id, el.dataset.rec, !!el.dataset.sweep),
  'sweep-skip': () => { const k = S.sheet.k; ensureMonth(k).sweep = { skip: true }; saveMonth(k); closeSheet(); render(); toast('En ' + mName(k) + ' lo que sobra se queda en la cuenta.'); },
  'sweep-unskip': el => { const k = el.dataset.k, d = ensureMonth(k); if (d.sweep) delete d.sweep.skip; if (d.sweep && !Object.keys(d.sweep).length) delete d.sweep; saveMonth(k); render(); },
  'split-all': el => {
    const v = splitFor(el.dataset.k);
    C().sweep = Object.assign({ on: true, acc: null }, C().sweep || {}, { split: v });
    for (const k of Object.keys(S.months)) { const d = S.months[k]; if (k >= CUR && d.sweep && d.sweep.split != null) { delete d.sweep.split; if (!Object.keys(d.sweep).length) delete d.sweep; saveMonth(k); } }
    saveConfig(); render(); toast(`Desde ahora, ${v} % a ${sweepPair()[0].name} y ${100 - v} % a ${sweepPair()[1].name}.`);
  },
  'sweep-confirm': el => {
    const k = el.dataset.k, it = itemsFor(k).list.find(x => x.sweep); if (!it) return;
    const c = C(), main = c.accounts.find(a => !isSaving(a)), { to } = distribute(k, it.amount, id => (accById(id) || {}).balance || 0);
    if (main) { main.balance = r2(main.balance - it.amount); main.asOf = todayISO(); }
    for (const [id, v] of Object.entries(to)) { const a = accById(id); if (a) { a.balance = r2(a.balance + v); a.asOf = todayISO(); } }
    const d = ensureMonth(k), o = d.sweep || {};
    d.sweep = Object.assign(o, { status: 'hecho', amount: it.amount, frozen: o.amount == null, to, applied: !!main, confirmedAt: todayISO() });
    saveMonth(k); saveConfig(); render();
    toast('Confirmado: ' + Object.entries(to).map(([id, v]) => `${eur(v)} a ${(accById(id) || { name: 'tu ahorro' }).name}`).join(' y ') + '.');
  },
  'sweep-unconfirm': el => {
    const k = el.dataset.k, d = ensureMonth(k), o = d.sweep || {}; if (o.status !== 'hecho') return;
    const was = !!o.applied;
    if (was) {
      const main = C().accounts.find(a => !isSaving(a));
      if (main) main.balance = r2(main.balance + o.amount);
      for (const [id, v] of Object.entries(o.to || {})) { const a = accById(id); if (a) a.balance = r2(a.balance - v); }
      saveConfig();
    }
    delete o.status; delete o.to; delete o.applied; delete o.confirmedAt; if (o.frozen) { delete o.amount; delete o.frozen; }
    if (Object.keys(o).length) d.sweep = o; else delete d.sweep;
    saveMonth(k); render(); toast(was ? 'Deshecho: los saldos vuelven a como estaban.' : 'Deshecho.');
  },
  'close-open': el => {
    const k = el.dataset.k, exp = expectedBalances(k), accs = {};
    // El ahorro viene con lo que la app calcula (solo hay que confirmarlo); las corrientes, con su saldo, para poner el del banco
    for (const a of C().accounts) accs[a.id] = amtStr(isSaving(a) ? exp[a.id] : a.balance);
    openSheet({ kind: 'close', k, done: true, accs, exp });
  },
  'close-save': () => saveClose(),
  'budget-open': el => openSheet({ kind: 'budget', k: el.dataset.k, key: el.dataset.key, amount: '', name: '' }),
  'spend-add': () => {
    const s = S.sheet, amount = parseAmount(s.amount);
    if (!(amount > 0)) return sheetError('Escribe cuánto has gastado (por ejemplo 30 o 12,50+8).');
    addSpend(s.k, s.key, amount, s.name);
    s.amount = ''; s.name = ''; s.err = ''; renderSheet(); render();
    const f = $('#f-amount'); if (f) f.focus({ preventScroll: true }); // listo para el siguiente, sin parpadeo
  },
  'spend-del': el => {
    const s = S.sheet, d = ensureMonth(s.k), sp = d.spends || {};
    sp[s.key] = (sp[s.key] || []).filter(x => x.id !== el.dataset.id);
    if (!sp[s.key].length) delete sp[s.key];
    saveMonth(s.k); renderSheet(); render();
  },
  'budget-edit': () => { const s = S.sheet, it = itemsFor(s.k).list.find(x => x.id === s.key); closeSheet(); if (!it) return; if (it.fixed) openFixed(it.recId); else openItem(s.k, { id: it.id }); },
  'close-undo': el => { const k = el.dataset.k, d = ensureMonth(k); delete d.closed; saveMonth(k); render(); toast(cap(mName(k)) + ' reabierto. Los saldos se quedan como están.'); },
  'split-reset': el => { const k = el.dataset.k, d = ensureMonth(k); if (d.sweep) { delete d.sweep.split; if (!Object.keys(d.sweep).length) delete d.sweep; } saveMonth(k); render(); },
  'sweep-settings': () => { closeSheet(); go('cuentas'); },
  'mark-all': el => { const k = el.dataset.k, d = ensureMonth(k); for (const it of itemsFor(k).list) { if (it.status === 'hecho' || it.sweep) continue; if (it.fixed) d.rec[it.recId] = Object.assign(d.rec[it.recId] || {}, { status: 'hecho' }); else d.items.find(x => x.id === it.id).status = 'hecho'; } saveMonth(k); render(); },
  unskip: el => { const k = el.dataset.k, d = ensureMonth(k), o = d.rec[el.dataset.rec] || {}; delete o.skip; if (Object.keys(o).length) d.rec[el.dataset.rec] = o; else delete d.rec[el.dataset.rec]; saveMonth(k); render(); },
  'fixed-new': el => openFixed(null, el.dataset.type),
  'fixed-edit': el => openFixed(el.dataset.id),
  'acc-new': el => openAcc(null, el.dataset.kind),
  'acc-edit': el => openAcc(el.dataset.id),
  'goal-edit': () => { const g = C().goal; openSheet({ kind: 'goal', name: g ? g.name : '', amount: g ? amtStr(g.target) : '', month: g ? g.month : addM(CUR, 12) }); },
  'example-clear': () => { clearAll(); render(); toast('Ejemplo borrado. Empieza por tus cuentas.'); },
  'example-keep': () => { C().example = false; saveConfig(); render(); },
  'export-csv': () => offerFile('cuentas-claras-' + todayISO() + '.csv', toCSV(exportRows()), 'Exportar a Excel'),
  'copy-tsv': () => copyText(toTSV(exportRows()), 'Copiado. Pégalo en una hoja de Excel.'),
  'export-json': () => offerFile('cuentas-claras-copia-' + todayISO() + '.json', JSON.stringify(backupData(), null, 1), 'Copia de seguridad'),
  'restore-open': () => openSheet({ kind: 'restore', json: '' }),
  'clear-all': el => { if (el.dataset.sure) { clearAll(); render(); toast('Datos borrados.'); } else { S.confirm = 'clear'; render(); } },
  'confirm-cancel': () => { S.confirm = null; render(); },
  'toast-do': () => { const f = toastFn; $('#toast').hidden = true; toastFn = null; if (f) f(); },
  // hojas
  'sheet-close': () => closeSheet(),
  'sheet-confirm': el => { S.sheet.confirm = el.dataset.v; renderSheet(); },
  'sheet-unconfirm': () => { S.sheet.confirm = null; renderSheet(); },
  set: el => { const s = S.sheet, f = el.dataset.f, v = el.dataset.v; if (f === 'type' && v !== s.type) { s.cat = ''; s.acc = ''; } if (f === 'cat' && s.cat === v) s[f] = ''; else s[f] = v; s.err = ''; renderSheet(); },
  'amounts-fill': () => { const s = S.sheet, st = gridStart(s); s.amounts = s.amounts || {}; for (let i = 0; i < 12; i++) s.amounts[addM(st, i)] = s.amount || ''; renderSheet(); },
  'month-toggle': el => { const s = S.sheet, m = Number(el.dataset.m), cur = s.months || []; s.months = cur.includes(m) ? cur.filter(x => x !== m) : cur.concat(m).sort((a, b) => a - b); s.err = ''; renderSheet(); },
  'add-cat': () => { const s = S.sheet, name = (s.newcat || '').trim(); if (!name) return; const list = C().cats[s.type] ||= []; if (!list.some(c => c.toLowerCase() === name.toLowerCase())) { list.push(name); saveConfig(); } s.cat = list.find(c => c.toLowerCase() === name.toLowerCase()); s.newcat = ''; renderSheet(); },
  'item-save': () => saveItem(),
  'item-del': () => { const s = S.sheet, d = ensureMonth(s.k); d.items = d.items.filter(x => x.id !== s.id); saveMonth(s.k); closeSheet(); render(); toast('Borrado.'); },
  'fixed-skip': () => { const s = S.sheet; ensureMonth(s.k).rec[s.recId] = { skip: true }; saveMonth(s.k); closeSheet(); render(); toast('Quitado de ' + mName(s.k) + '. Los demás meses siguen igual.'); },
  'fixed-goto': () => { const id = S.sheet.recId; closeSheet(); openFixed(id); },
  'fixed-save': () => saveFixed(),
  'fixed-end': () => { const c = C(), r = c.recurring.find(x => x.id === S.sheet.id); if (!r) return closeSheet(); if (r.from >= CUR) c.recurring = c.recurring.filter(x => x !== r); else r.to = addM(CUR, -1); saveConfig(); closeSheet(); render(); toast('Terminado: ya no cuenta desde ' + mName(CUR) + '.'); },
  'fixed-del': () => { deleteRec(S.sheet.id); closeSheet(); render(); toast('Fijo borrado de todos los meses.'); },
  'acc-save': () => saveAcc(),
  'acc-del': () => { const c = C(), id = S.sheet.id; c.accounts = c.accounts.filter(a => a.id !== id); if (c.mainAcc === id) c.mainAcc = null; saveConfig(); closeSheet(); render(); toast('Cuenta borrada.'); },
  'goal-save': () => { const s = S.sheet, t = parseAmount(s.amount); if (!(t > 0)) return sheetError('Escribe cuánto quieres tener.'); C().goal = { name: (s.name || '').trim() || 'Meta de ahorro', target: t, month: s.month || addM(CUR, 12) }; saveConfig(); closeSheet(); render(); },
  'goal-del': () => { C().goal = null; saveConfig(); closeSheet(); render(); },
  'restore-do': () => {
    let data; try { data = JSON.parse(S.sheet.json || ''); } catch (e) { return sheetError('Ese texto no es una copia válida (no se puede leer como JSON).'); }
    if (!data || typeof data !== 'object' || !data.config) return sheetError('No encuentro los datos dentro de la copia. ¿Es un fichero de Cuentas Claras?');
    restoreFrom(data); closeSheet(); render(); toast('Copia restaurada.');
  },
  'text-copy': () => { const t = $('#f-text'); copyText(t.value, 'Copiado.'); t.select(); },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const f = A[el.dataset.act];
  if (f) { e.preventDefault(); f(el, e); }
});
function prefillAmounts(s) {
  if (s.freq !== 'variable') return;
  const st = gridStart(s); s.amounts = s.amounts || {};
  if (Array.from({ length: 12 }, (_, i) => s.amounts[addM(st, i)]).some(v => v != null && v !== '')) return;
  for (let i = 0; i < 12; i++) s.amounts[addM(st, i)] = s.amount || '';
}
function splitLabels(el) {
  const box = el.closest('.split'), total = Number(box.dataset.total), suf = box.dataset.suffix, p = Number(el.value), dec = suf ? { dec: 0 } : {};
  el.style.setProperty('--p', p + '%');
  box.querySelector('[data-side="1"]').textContent = `${p} % · ${suf ? '≈ ' : ''}${eur(total * p / 100, dec)}${suf}`;
  box.querySelector('[data-side="2"]').textContent = `${100 - p} % · ${suf ? '≈ ' : ''}${eur(total * (100 - p) / 100, dec)}${suf}`;
}
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset && el.dataset.split) { splitLabels(el); return; }
  if (S.sheet && el.dataset && el.dataset.amt) { (S.sheet.amounts ||= {})[el.dataset.amt] = el.value; return; }
  if (S.sheet && el.dataset && el.dataset.acc) { S.sheet.accs[el.dataset.acc] = el.value; return; }
  if (!S.sheet || !el.dataset || !el.dataset.f) return;
  S.sheet[el.dataset.f] = el.type === 'checkbox' ? el.checked : el.value;
  if (el.dataset.f === 'freq') prefillAmounts(S.sheet);
  if (el.dataset.f === 'repeat' || el.dataset.f === 'from' || el.dataset.f === 'freq') renderSheet();
});
document.addEventListener('change', e => {
  const key = e.target.dataset && e.target.dataset.split;
  if (key) {
    const v = Number(e.target.value);
    if (key === 'all') { C().sweep = Object.assign({ on: true, acc: null }, C().sweep || {}, { split: v }); saveConfig(); }
    else {
      const d = ensureMonth(key), o = d.sweep || {};
      if (v === splitDefault()) delete o.split; else o.split = v;
      if (Object.keys(o).length) d.sweep = o; else delete d.sweep;
      saveMonth(key);
    }
    render();
    return;
  }
  const setting = e.target.dataset && e.target.dataset.setting;
  if (setting === 'name') {
    const v = e.target.value.trim().replace(/\s+/g, ' ').slice(0, 30);
    if (v && v !== DEFAULT_NAME) C().name = v; else delete C().name;
    saveConfig(); render();
    toast(`La app se llama ahora «${appName()}».`);
    return;
  }
  if (setting === 'start') {
    C().start = e.target.value || null; saveConfig(); render();
    toast(C().start ? `Las cuentas empiezan en ${mLong(C().start)}.` : 'Se muestran todos los meses.');
    return;
  }
  if (setting) {
    const v = e.target.value, sw = Object.assign({ on: true, acc: null }, C().sweep || {});
    if (setting === 'sweep') { if (v === 'off') sw.on = false; else { sw.on = true; sw.acc = v || null; if (sw.over === sw.acc) sw.over = null; } }
    if (setting === 'sweep-cap') {
      const n = v.trim() === '' ? 0 : parseAmount(v);
      if (isNaN(n) || n < 0) { toast('No entiendo esa cantidad. Escríbela como 10.000 o déjala vacía.'); return; }
      sw.cap = n;
    }
    if (setting === 'sweep-over') sw.over = v;
    C().sweep = sw;
    if (sw.cap > 0 && !isSaving(accById(sw.over))) sw.over = (C().accounts.find(a => isSaving(a) && a.id !== (sweepDest() || {}).id) || {}).id || null;
    saveConfig(); render();
    toast('Lo que sobra ' + (sweepOn() ? 'pasará a ' : '') + sweepPhrase().replace(/<[^>]+>/g, '') + '.');
    return;
  }
  const el = e.target; if (!S.sheet || !el.dataset || !el.dataset.f || el.tagName !== 'SELECT') return;
  S.sheet[el.dataset.f] = el.value;
  if (el.dataset.f === 'freq') prefillAmounts(S.sheet);
  if (el.dataset.f === 'from' || el.dataset.f === 'freq') renderSheet();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.sheet) closeSheet();
  if (e.key === 'Enter' && S.sheet && e.target.id === 'f-newcat') { e.preventDefault(); A['add-cat'](); return; }
  if (e.key === 'Enter' && e.target.id === 'f-appname') { e.preventDefault(); e.target.blur(); return; }
  if (e.key === 'Enter' && S.sheet && S.sheet.kind === 'budget' && e.target.tagName === 'INPUT') { e.preventDefault(); A['spend-add'](); return; }
  if (e.key === 'Enter' && S.sheet && e.target.tagName === 'INPUT' && e.target.type !== 'checkbox') {
    const save = $('#sheet-root .sh-foot .btn.primary'); if (save) { e.preventDefault(); save.click(); }
  }
});

boot();
/* Actualizarse sola: al abrir y al volver a la app se mira si hay una versión nueva publicada */
if (IS_APP && 'serviceWorker' in navigator) {
  let reg = null, lastCheck = 0, reloading = false;
  const reload = () => { if (reloading) return; reloading = true; location.reload(); };
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController && !S.sheet) reload(); });
  async function checkUpdate() {
    if (Date.now() - lastCheck < 60000) return;
    lastCheck = Date.now();
    try {
      if (reg) reg.update().catch(() => {});
      const html = await (await fetch('index.html?v=' + Date.now(), { cache: 'no-store' })).text();
      const m = html.match(/APP_VERSION = '(\d+)'/);
      if (!m || m[1] === APP_VERSION) return;
      let tried = ''; try { tried = sessionStorage.getItem('cc-version') || ''; } catch (e) { /* sin almacenamiento */ }
      if (tried === m[1]) return; // ya se recargó para esta versión
      try { sessionStorage.setItem('cc-version', m[1]); } catch (e) { /* sin almacenamiento */ }
      if (S.sheet) toast('Hay una versión nueva de la app.', { label: 'Actualizar', fn: reload }); else reload();
    } catch (e) { /* sin conexión: ya se mirará */ }
  }
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(r => { reg = r; }).catch(() => {});
    setTimeout(checkUpdate, 2500);
  });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(); });
}
</script>
