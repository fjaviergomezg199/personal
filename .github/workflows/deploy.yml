name: Comprobar y publicar

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Pruebas y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Opcional: ID de cliente de Google para que la app venga ya configurada
          # (Settings → Secrets and variables → Actions → Variables).
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          # Opcional: otro servidor de hogares (si no, el de src/lib/config.ts).
          VITE_HOGAR_SERVER: ${{ vars.VITE_HOGAR_SERVER }}
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    name: Publicar en GitHub Pages
    needs: build
    # Solo si el repositorio es público (o si se activa la variable DEPLOY_PAGES=true).
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (github.event.repository.private == false || vars.DEPLOY_PAGES == 'true')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
